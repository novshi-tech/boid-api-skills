apiVersion: boid.dev/v1
kind: IntegrationPack
metadata:
  name: slack
  version: 1.0.0

serviceProfiles:
  - name: slack
    endpoint:
      # Slack Web API has a single fixed base URL (https://slack.com/api) —
      # there is no per-tenant hostname to configure, so instances of this
      # profile must not supply one (docs/plans/signal-driven-review.md
      # §7.1's worked example for "endpoint 固定のサービス (Slack)").
      #
      # This was originally declared `configurable: false`, but v0's loader
      # (internal/integrationpack/resolve.go, DesugarService) has no
      # Pack-declared default-endpoint mechanism yet — a `configurable: false`
      # profile is rejected outright for any `uses:` service entry. Confirmed
      # on real hardware 2026-08-27: adding the first real slack-cloud
      # service instance to config.yaml made the daemon refuse to start with
      # `daemon startup refused: resolve integration pack services:
      # integrationpack: service "slack-cloud": profile "slack" declares
      # endpoint.configurable: false, which v0 does not yet support for
      # uses:`. Until the loader grows a default-endpoint mechanism, this
      # profile declares `configurable: true` and instances must write
      # `endpoint: https://slack.com/api` themselves (same value every
      # operator will use, just written once per instance instead of baked
      # into this manifest — same workaround as bitbucket-cloud's profile).
      configurable: true
    credentials:
      # Slack Web API auth is `Authorization: Bearer <token>` — either a bot
      # token (xoxb-...) or a user token (xoxp-...). search.messages (used
      # by the mentions connector) requires a USER token with the
      # search:read scope; Slack does not expose search to bot tokens at
      # all. See skills/slack-api/references/authentication.md.
      - name: token
        injection: bearer

connectors:
  - name: mentions
    executable: connectors/mentions
    serviceProfile: slack
    configSchema:
      type: object
      properties:
        # Max hits requested per search.messages query (one call for
        # "<@my_user_id>", one for "to:<@my_user_id>"). Optional — defaults
        # to 20 inside the connector when omitted, matching the migrated
        # khi-task-collector adapter's own default. The connector does not
        # paginate beyond this single page, so raise it for a workspace
        # with an unusually bursty mention volume within one trigger
        # interval — connectors/mentions warns on stderr when a page comes
        # back full without reaching the cursor, which is the signal that
        # count should go up.
        count:
          type: number

skills:
  - name: slack-api
    path: skills/slack-api
    requiresServiceProfile: slack
