apiVersion: boid.dev/v1
kind: IntegrationPack
metadata:
  name: msgraph
  version: 1.0.0

serviceProfiles:
  - name: msgraph
    endpoint:
      configurable: true
    credentials:
      # Declared for completeness, and NOT how a real instance is wired —
      # same situation as the gmail Pack, see its manifest for the full note.
      # Microsoft Graph is OAuth2 (device flow + refresh) and a Pack
      # credential slot can only express a STATIC secret, so a workspace
      # points this connector at its existing oauth2 service instance
      # (`msgraph`, `auth: {kind: oauth2, provider: microsoft}`) and the
      # gateway refreshes the token itself. boid never cross-checks a
      # connector's declared profile against the instance it is given.
      - name: token
        injection: bearer

connectors:
  - name: unread-to-me
    executable: connectors/unread-to-me
    serviceProfile: msgraph
    configSchema:
      type: object
      properties:
        # Which mail folder to watch. Graph's well-known names work here
        # (inbox is the default); a folder id also works.
        folder:
          type: string
        # Page size for the message list.
        top:
          type: number
        # How far back the very first, cursor-less run looks.
        initial_window_days:
          type: number
        # Senders whose mail never becomes a Signal, grown per workspace.
        # `no-reply`-style local parts are already excluded by default (an
        # address that says "do not reply" is by definition not a person
        # writing to you, which is the connector's whole premise); these two
        # are for the rest — notification and marketing senders that use an
        # ordinary-looking address. Measured on a real inbox, they are the
        # majority of what survives the To filter, and every one of them would
        # otherwise cost a judgment round.
        # **カンマ区切りの文字列**。Pack の configSchema v0 は string/number/boolean
        # しか受けない (array を書くと manifest のロードで落ちる) ので、リストは
        # この形で渡す —— core に型を足すのはこの connector 1 本の都合より広い話。
        exclude_senders:
          type: string
        exclude_domains:
          type: string

skills:
  - name: microsoft-graph-api
    path: skills/microsoft-graph-api
    requiresServiceProfile: msgraph
